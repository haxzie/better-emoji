# Builds, signs, notarizes and publishes the macOS app as a GitHub release.
#
# Trigger by pushing a version tag:   git tag v0.2.0 && git push origin v0.2.0
# …or run it manually from the Actions tab with a version number.
#
# The zip name contains "macOS" so the in-app updater (UpdateChecker.swift)
# picks it up from the release assets.
#
# Required secrets (run apps/mac/scripts/setup-release-secrets.sh once):
#   MACOS_CERT_P12_BASE64   Developer ID Application cert + key, base64 .p12
#   MACOS_CERT_PASSWORD     password for that .p12
#   APPLE_API_KEY_P8        App Store Connect API key (.p8 contents)
#   APPLE_API_KEY_ID        the key's ID
#   APPLE_API_ISSUER_ID     the key's issuer ID

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0 (tag v0.2.0 is created)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  APP: Better Emoji
  SIGN_IDENTITY: 'Developer ID Application: Musthaq Ahamad (2WH7TUH8N5)'

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "bad version: $VERSION" >&2; exit 1; }
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "zip=Better-Emoji-macOS-v$VERSION.zip"
          } >> "$GITHUB_OUTPUT"

      # ── JS: emoji index + encoder ──────────────────────────────────────────
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache emoji index + encoder
        id: index-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/emoji-index/dist
            packages/emoji-index/models
          key: emoji-index-${{ hashFiles('packages/emoji-index/scripts/build-index.mjs', 'packages/emoji-index/scripts/fetch-model.mjs', 'packages/emoji-index/scripts/phrasings.json', 'pnpm-lock.yaml') }}

      - name: Build emoji index + fetch encoder
        if: steps.index-cache.outputs.cache-hit != 'true'
        run: |
          pnpm index:build
          pnpm index:fetch-model

      # ── Swift: build, bundle, sign ─────────────────────────────────────────
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: apps/mac/.build
          key: spm-${{ runner.os }}-${{ hashFiles('apps/mac/Package.resolved') }}

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build, bundle and sign
        working-directory: apps/mac
        env:
          VERSION: ${{ steps.v.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/bundle.sh

      # ── Notarize + staple ──────────────────────────────────────────────────
      - name: Notarize
        working-directory: apps/mac
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$API_KEY_P8" > "$KEY"
          ditto -c -k --keepParent "build/$APP.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$KEY" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          ID=$(jq -r .id "$RUNNER_TEMP/notary.json")
          STATUS=$(jq -r .status "$RUNNER_TEMP/notary.json")
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization $STATUS"
            xcrun notarytool log "$ID" --key "$KEY" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID"
            exit 1
          fi
          rm -f "$KEY"
          xcrun stapler staple "build/$APP.app"
          spctl --assess --type execute --verbose=2 "build/$APP.app"

      - name: Package
        working-directory: apps/mac
        env:
          ZIP: ${{ steps.v.outputs.zip }}
        run: |
          ditto -c -k --keepParent "build/$APP.app" "build/$ZIP"
          shasum -a 256 "build/$ZIP" | tee "build/$ZIP.sha256"

      # ── Publish ────────────────────────────────────────────────────────────
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          ZIP: ${{ steps.v.outputs.zip }}
        run: |
          # For workflow_dispatch the tag doesn't exist yet; gh creates it at this commit.
          gh release create "$TAG" \
            "apps/mac/build/$ZIP" "apps/mac/build/$ZIP.sha256" \
            --target "$GITHUB_SHA" \
            --title "Better Emoji $TAG" \
            --generate-notes

      - name: Remove signing keychain
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
