name: Mirror release to R2

# A second copy of the macOS zip in the `better-emoji` R2 bucket, and a
# latest.json that says where it is.
#
# The GitHub release stays the source of truth and is untouched: the in-app
# updater (apps/mac/…/UpdateChecker.swift) reads releases/latest from the
# GitHub API and installs the zip attached there. What this adds is what the
# *website* needs — a download that arrives at line speed from Cloudflare, and
# an answer to "what is the current version" that does not spend GitHub's
# 60-requests-an-hour unauthenticated budget on every visitor.
#
# The Worker in apps/web/server/index.ts serves the bucket:
#   emoji.haxzie.com/download              → 302 to the URL in latest.json
#   emoji.haxzie.com/releases/latest.json  → the manifest
#   emoji.haxzie.com/releases/<v>/<zip>    → the build
#
# Called by release.yml once the release is published, rather than left to the
# `release: published` event: a release created by that workflow's own
# GITHUB_TOKEN deliberately does not raise one — GitHub's recursion guard — so
# nothing would ever run. The event trigger is kept for a release published by
# hand, where a human's token does raise it.
#
# Repository secrets (run apps/web/scripts/setup-mirror-secrets.sh once):
#   R2_ACCOUNT_ID          Cloudflare dashboard → R2 → Account details
#   R2_ACCESS_KEY_ID       R2 → Manage API tokens, object read+write on `better-emoji`
#   R2_SECRET_ACCESS_KEY

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to mirror, e.g. v0.1.0"
        required: true
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to mirror, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

# One bucket and one latest.json, so two runs must never overlap. Not cancelled
# either: a run stopped between the upload and the manifest leaves a zip in the
# bucket that nothing points at, which is the one state this cannot tidy up.
concurrency:
  group: release-mirror
  cancel-in-progress: false

env:
  BUCKET: better-emoji
  PREFIX: releases
  PUBLIC_URL: https://emoji.haxzie.com
  # The AWS CLI sends integrity headers R2 rejects unless they are asked for
  # only where the protocol requires them.
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  AWS_DEFAULT_REGION: auto

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -eu
          case "$TAG" in
            v*) ;;
            *) echo "::error::$TAG is not a release tag."; exit 1 ;;
          esac
          version="${TAG#v}"

          # The zip only. release.yml names it `Better-Emoji-macOS-v<version>.zip`;
          # the .sha256 beside it is folded into latest.json instead.
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*macOS*.zip' --pattern '*macOS*.dmg' --dir dist
          count=$(ls dist/*.zip 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" != "1" ]; then
            echo "::error::expected exactly one macOS zip in $TAG, found $count."
            exit 1
          fi
          file=$(basename "$(ls dist/*.zip)")
          # The DMG is what people download from the site; releases before 0.3.0 have none.
          dmg=""
          if ls dist/*.dmg >/dev/null 2>&1; then
            dmg=$(basename "$(ls dist/*.dmg)")
            echo "dmg=$dmg"
            echo "dmg_size=$(stat -c%s "dist/$dmg")"
            echo "dmg_sha256=$(sha256sum "dist/$dmg" | cut -d' ' -f1)"
          fi >> "$GITHUB_OUTPUT"

          # Read from the release rather than from the event payload, so a
          # manual re-run carries the timestamp the automatic one would have.
          published_at=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json publishedAt --jq .publishedAt)

          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "file=$file"
            echo "size=$(stat -c%s "dist/$file")"
            echo "sha256=$(sha256sum "dist/$file" | cut -d' ' -f1)"
            echo "published_at=$published_at"
          } >> "$GITHUB_OUTPUT"

      # Guards a manual re-mirror of an older tag: pointing latest.json at a
      # build that predates the current one would downgrade every download on
      # the site, silently and for everybody.
      - name: Refuse to go backwards
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -eu
          current=$(curl -fsSL "$PUBLIC_URL/$PREFIX/latest.json" 2>/dev/null |
            sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' | head -n 1) || current=""
          if [ -z "$current" ]; then
            echo "no latest.json yet — $VERSION will be the first."
            exit 0
          fi
          newest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)
          if [ "$newest" != "$VERSION" ] && [ "$current" != "$VERSION" ]; then
            echo "::error::latest.json already points at $current, which is newer than $VERSION."
            exit 1
          fi

      - name: Upload the zip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          VERSION: ${{ steps.release.outputs.version }}
          FILE: ${{ steps.release.outputs.file }}
        run: |
          set -eu
          # Version-pinned key, so the object never changes and the Worker can
          # cache it for as long as anyone cares to keep it.
          aws s3 cp "dist/$FILE" "s3://$BUCKET/$PREFIX/$VERSION/$FILE" \
            --endpoint-url "https://$ACCOUNT_ID.r2.cloudflarestorage.com" \
            --content-type application/zip \
            --cache-control "public, max-age=31536000, immutable" \
            --only-show-errors
          if [ -n "${DMG:-}" ]; then
            aws s3 cp "dist/$DMG" "s3://$BUCKET/$PREFIX/$VERSION/$DMG" \
              --endpoint-url "https://$ACCOUNT_ID.r2.cloudflarestorage.com" \
              --content-type application/x-apple-diskimage \
              --cache-control "public, max-age=31536000, immutable" \
              --only-show-errors
          fi

      - name: Update latest.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          FILE: ${{ steps.release.outputs.file }}
          SIZE: ${{ steps.release.outputs.size }}
          SHA256: ${{ steps.release.outputs.sha256 }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
          DMG: ${{ steps.release.outputs.dmg }}
          DMG_SIZE: ${{ steps.release.outputs.dmg_size }}
          DMG_SHA256: ${{ steps.release.outputs.dmg_sha256 }}
        run: |
          set -eu
          # `url`/`size`/`sha256` are the zip — that's what the in-app updater reads.
          # `dmg` is what the site's /download button hands to people.
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg publishedAt "$PUBLISHED_AT" \
            --arg filename "$FILE" \
            --arg url "$PUBLIC_URL/$PREFIX/$VERSION/$FILE" \
            --arg sha256 "$SHA256" \
            --argjson size "$SIZE" \
            --arg dmg "$DMG" \
            --arg dmgUrl "$PUBLIC_URL/$PREFIX/$VERSION/$DMG" \
            --arg dmgSha256 "$DMG_SHA256" \
            --argjson dmgSize "${DMG_SIZE:-0}" \
            '{
              version: $version,
              tag: $tag,
              publishedAt: $publishedAt,
              platform: "darwin-arm64",
              filename: $filename,
              url: $url,
              size: $size,
              sha256: $sha256
            } + (if $dmg == "" then {} else
              { dmg: { filename: $dmg, url: $dmgUrl, size: $dmgSize, sha256: $dmgSha256 } }
            end)' > latest.json
          cat latest.json

          # Short TTL: this is the one object that changes, and a release nobody
          # can see for an hour is a release that did not happen. The Worker's
          # cache and the site's version badge both honour this number.
          aws s3 cp latest.json "s3://$BUCKET/$PREFIX/latest.json" \
            --endpoint-url "https://$ACCOUNT_ID.r2.cloudflarestorage.com" \
            --content-type application/json \
            --cache-control "public, max-age=60" \
            --only-show-errors

      # Through the site rather than the bucket, because that is the path every
      # visitor takes — a bucket write that succeeds behind a Worker that is not
      # serving it is the failure this catches.
      - name: Check it is actually there
        env:
          VERSION: ${{ steps.release.outputs.version }}
          FILE: ${{ steps.release.outputs.file }}
          DMG: ${{ steps.release.outputs.dmg }}
        run: |
          set -eu
          curl -fsSL "$PUBLIC_URL/$PREFIX/latest.json" | tee /dev/stderr | grep -q "\"version\": *\"$VERSION\""
          for f in "$FILE" ${DMG:+"$DMG"}; do
            code=$(curl -sIL -o /dev/null -w '%{http_code}' "$PUBLIC_URL/$PREFIX/$VERSION/$f")
            [ "$code" = "200" ] || { echo "::error::$PUBLIC_URL/$PREFIX/$VERSION/$f returned $code"; exit 1; }
          done
          # /download hands people the DMG when there is one, else the zip.
          want="$PUBLIC_URL/$PREFIX/$VERSION/${DMG:-$FILE}"
          location=$(curl -sI -o /dev/null -w '%{redirect_url}' "$PUBLIC_URL/download")
          [ "$location" = "$want" ] || { echo "::error::/download points at $location, expected $want"; exit 1; }
